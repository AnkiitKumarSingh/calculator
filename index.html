<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== STEP 2: STYLE =====
     Layout idea: one centred card, a display on top, a 4-column button grid below. */
  :root {
    --bg: #e9edf2;
    --card: #ffffff;
    --screen: #f3f5f8;
    --key: #eef1f5;
    --key-text: #1c2430;
    --muted: #6b7686;
    --fn: #dde3eb;
    --accent: #2f6fde;
    --accent-text: #ffffff;
    --font-display: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151b; --card: #1a2029; --screen: #12171e; --key: #252c37;
      --key-text: #e8edf4; --muted: #8b96a8; --fn: #323b48;
      --accent: #4c8af0; --accent-text: #ffffff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11151b; --card: #1a2029; --screen: #12171e; --key: #252c37;
    --key-text: #e8edf4; --muted: #8b96a8; --fn: #323b48;
    --accent: #4c8af0; --accent-text: #ffffff; color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: var(--bg); color: var(--key-text);
    font-family: var(--font-body);
  }
  .calculator {
    width: 100%; max-width: 340px; padding: 20px; border-radius: 20px;
    background: var(--card); box-shadow: 0 12px 32px rgba(15, 25, 40, 0.14);
    display: flex; flex-direction: column; gap: 16px;
  }
  .display {
    min-height: 104px; padding: 14px 16px; border-radius: 12px; background: var(--screen);
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 4px;
    font-family: var(--font-display); font-variant-numeric: tabular-nums;
  }
  .history { min-height: 20px; font-size: 15px; color: var(--muted); }
  .current { font-size: 40px; font-weight: 300; line-height: 1.1; word-break: break-all; text-align: right; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    height: 60px; border: none; border-radius: 12px; cursor: pointer;
    font: 500 22px var(--font-body); background: var(--key); color: var(--key-text);
    transition: filter 0.1s, transform 0.05s;
  }
  button:hover { filter: brightness(0.95); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .fn { background: var(--fn); }
  .op { color: var(--accent); background: var(--fn); }
  .equals { background: var(--accent); color: var(--accent-text); }
  .zero { grid-column: span 2; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
  <!-- ===== STEP 1: STRUCTURE ===== -->
  <main class="calculator">
    <div class="display" aria-live="polite">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="keys" id="keys">
      <button class="fn" data-action="clear">C</button>
      <button class="fn" data-action="delete" aria-label="Delete">⌫</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-operator="÷">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="op" data-operator="×">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="op" data-operator="−">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="op" data-operator="+">+</button>

      <button class="zero" data-number="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>

    <p class="hint">Keyboard works too: numbers, + − * /, Enter, Backspace, Esc</p>
  </main>

  <script>
    // ===== STEP 3: LOGIC =====
    const historyEl = document.getElementById('history');
    const currentEl = document.getElementById('current');

    // The calculator's memory
    let current = '0';      // number on screen
    let previous = null;    // first number of the sum
    let operator = null;    // + − × ÷
    let overwrite = false;  // next digit starts a new number
    let historyText = '';

    function updateDisplay() {
      currentEl.textContent = current;
      historyEl.textContent = operator ? `${previous} ${operator}` : historyText;
    }

    function calculate(a, b, op) {
      if (op === '+') return a + b;
      if (op === '−') return a - b;
      if (op === '×') return a * b;
      if (op === '÷') return b === 0 ? null : a / b;
    }

    // Rounds away floating-point noise, so 0.1 + 0.2 shows 0.3
    function format(n) {
      if (n === null || !isFinite(n)) return 'Error';
      return String(parseFloat(n.toPrecision(12)));
    }

    function inputNumber(digit) {
      if (overwrite || current === '0' || current === 'Error') {
        current = digit;
        overwrite = false;
      } else if (current.length < 15) {
        current += digit;
      }
    }

    function inputDecimal() {
      if (overwrite || current === 'Error') {
        current = '0.';
        overwrite = false;
      } else if (!current.includes('.')) {
        current += '.';
      }
    }

    function chooseOperator(op) {
      if (current === 'Error') return;
      // Chained sums: 2 + 3 + … works out 2 + 3 first
      if (operator && !overwrite) {
        current = format(calculate(+previous, +current, operator));
        if (current === 'Error') { operator = null; previous = null; overwrite = true; return; }
      }
      previous = current;
      operator = op;
      overwrite = true;
      historyText = '';
    }

    function equals() {
      if (!operator) return;
      const result = format(calculate(+previous, +current, operator));
      historyText = `${previous} ${operator} ${current} =`;
      current = result;
      previous = null;
      operator = null;
      overwrite = true;
    }

    function clearAll() {
      current = '0'; previous = null; operator = null; overwrite = false; historyText = '';
    }

    function deleteLast() {
      if (overwrite || current === 'Error') return;
      current = current.slice(0, -1);
      if (current === '' || current === '-') current = '0';
    }

    function percent() {
      if (current === 'Error') return;
      current = format(parseFloat(current) / 100);
    }

    // One click listener for every button
    document.getElementById('keys').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const { number, operator: op, action } = btn.dataset;

      if (number !== undefined) inputNumber(number);
      else if (op) chooseOperator(op);
      else if (action === 'decimal') inputDecimal();
      else if (action === 'equals') equals();
      else if (action === 'clear') clearAll();
      else if (action === 'delete') deleteLast();
      else if (action === 'percent') percent();

      updateDisplay();
    });

    // Keyboard support
    const keyOps = { '+': '+', '-': '−', '*': '×', '/': '÷' };
    document.addEventListener('keydown', (e) => {
      const k = e.key;
      if (/^[0-9]$/.test(k)) inputNumber(k);
      else if (k === '.') inputDecimal();
      else if (keyOps[k]) chooseOperator(keyOps[k]);
      else if (k === 'Enter' || k === '=') equals();
      else if (k === 'Backspace') deleteLast();
      else if (k === 'Escape') clearAll();
      else if (k === '%') percent();
      else return;
      e.preventDefault();
      updateDisplay();
    });

    updateDisplay();
  </script>
</body>
</html>
